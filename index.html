<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Colombo Training Convention 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
  rel="stylesheet"
>


<style>

/* ============================================================
   DESIGN SYSTEM
   ============================================================ */

:root{

  --ocean:#0877B9;
  --ocean-deep:#07536D;
  --teal:#0A7C78;

  --sun:#F7C94B;
  --sunset:#F37B45;

  --ink:#153746;
  --muted:#6C7F88;

  --success:#148A63;
  --error:#C94242;

  --font-body:
    'DM Sans',
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    sans-serif;

  --font-display:
    'Manrope',
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    sans-serif;


  /* ========================================================
     BACKGROUND POSTER
     ======================================================== */

  --hero-bg-image:
    url('https://iili.io/naLypqB.png');


  --poster-ar:1.75587;

  --safe-fraction:.445;


  --safe-y:
    calc(
      min(
        calc(100vw * var(--poster-ar)),
        100vh
      )
      *
      var(--safe-fraction)
    );

}


@supports (height:100dvh){

  :root{

    --safe-y:
      calc(
        min(
          calc(100vw * var(--poster-ar)),
          100dvh
        )
        *
        var(--safe-fraction)
      );

  }

}


/* ============================================================
   BASE
   ============================================================ */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html,
body{
  min-height:100%;
}


body{

  overflow-x:hidden;

  font-family:
    var(--font-body);

  color:
    var(--ink);

  background:
    linear-gradient(
      180deg,
      #BFEAFF 0%,
      #FFF2BE 43%,
      #FFD8B8 70%,
      #F5FBFA 100%
    );

}


/* ============================================================
   BACKGROUND
   ============================================================ */

.hero-bg{

  position:fixed;

  inset:0;

  z-index:0;

  pointer-events:none;


  background-image:

    var(--hero-bg-image),

    linear-gradient(
      150deg,
      #93E0FF 0%,
      #E2F7FF 34%,
      #FFE37E 64%,
      #FF9B68 100%
    );


  background-size:
    contain,
    cover;


  background-position:
    top center,
    center;


  background-repeat:
    no-repeat,
    no-repeat;

}


.bg-overlay{

  position:fixed;

  inset:0;

  z-index:1;

  pointer-events:none;


  background:
    linear-gradient(
      180deg,

      rgba(255,255,255,0)
      0%,

      rgba(255,255,255,0)
      calc(var(--safe-y) - 65px),

      rgba(246,252,252,.56)
      calc(var(--safe-y) + 15px),

      rgba(246,252,252,.93)
      80%,

      #F7FBFA
      100%
    );

}


/* ============================================================
   ACCESSIBILITY
   ============================================================ */

.sr-only{

  position:absolute;

  width:1px;

  height:1px;

  padding:0;

  margin:-1px;

  overflow:hidden;

  clip:rect(0,0,0,0);

  white-space:nowrap;

  border:0;

}


/* ============================================================
   PAGE
   ============================================================ */

.page{

  position:relative;

  z-index:2;

  min-height:100vh;

  display:flex;

  flex-direction:column;

  align-items:center;


  padding:

    var(--safe-y)

    15px

    24px;

}


@supports (height:100dvh){

  .page{

    min-height:100dvh;

  }

}


/* ============================================================
   COUNTDOWN
   ============================================================ */

.countdown-wrap{

  width:min(
    100%,
    390px
  );


  margin:

    0 auto 11px;


  padding:

    11px 14px 12px;


  border:

    1px solid
    rgba(255,255,255,.85);


  border-radius:20px;


  background:

    rgba(255,255,255,.82);


  backdrop-filter:

    blur(16px)
    saturate(135%);


  -webkit-backdrop-filter:

    blur(16px)
    saturate(135%);


  box-shadow:

    0 14px 34px
    rgba(12,79,103,.13);

}


.countdown-label{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;


  margin-bottom:7px;


  color:
    var(--ocean-deep);


  font-family:
    var(--font-display);


  font-size:.66rem;

  font-weight:800;


  letter-spacing:.07em;

  text-transform:uppercase;

}


.countdown-label::before{

  content:"";


  width:7px;

  height:7px;


  border-radius:50%;


  background:
    var(--sunset);


  box-shadow:

    0 0 0 4px
    rgba(243,123,69,.12);

}


.countdown-stats{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

}


.stat-box{

  width:57px;

  height:49px;


  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;


  border-radius:14px;


  background:

    rgba(238,249,252,.95);


  border:

    1px solid
    rgba(8,119,185,.10);

}


.stat-num{

  color:
    var(--ocean-deep);


  font-family:
    var(--font-display);


  font-size:1.15rem;

  font-weight:800;

  line-height:1;


  font-variant-numeric:
    tabular-nums;

}


.stat-label{

  margin-top:3px;


  color:
    var(--muted);


  font-size:.47rem;

  font-weight:700;


  letter-spacing:.08em;

  text-transform:uppercase;

}


.stat-sep{

  color:
    var(--sunset);


  font-size:.8rem;

  font-weight:800;

}


.countdown-done{

  display:inline-flex;

  align-items:center;

  justify-content:center;


  padding:

    9px 16px;


  border-radius:999px;


  background:#FFFFFF;


  color:
    var(--ocean-deep);


  font-size:.82rem;

  font-weight:800;

}


/* ============================================================
   CARD
   ============================================================ */

.card{

  position:relative;

  overflow:hidden;


  width:100%;

  max-width:390px;


  padding:

    19px 17px 17px;


  border:

    1px solid
    rgba(255,255,255,.94);


  border-radius:23px;


  background:

    rgba(255,255,255,.92);


  backdrop-filter:

    blur(20px)
    saturate(140%);


  -webkit-backdrop-filter:

    blur(20px)
    saturate(140%);


  box-shadow:

    0 24px 60px
    rgba(12,79,103,.16);

}


.card::before{

  content:"";


  position:absolute;

  top:0;

  left:0;

  right:0;


  height:5px;


  background:

    linear-gradient(
      90deg,

      var(--ocean),

      var(--teal),

      var(--sun),

      var(--sunset)
    );

}


.section-kicker{

  display:inline-flex;

  align-items:center;

  gap:6px;


  margin-bottom:7px;


  padding:

    5px 9px;


  border-radius:999px;


  background:#EDF8FC;


  color:
    var(--ocean-deep);


  font-size:.6rem;

  font-weight:800;


  letter-spacing:.07em;

  text-transform:uppercase;

}


.section-kicker::before{

  content:"";


  width:7px;

  height:7px;


  border-radius:50%;


  background:
    var(--sun);

}


.card-title{

  color:#123A4A;


  font-family:
    var(--font-display);


  font-size:1.2rem;

  font-weight:800;


  line-height:1.2;


  letter-spacing:-.025em;

}


.card-instruction{

  margin:

    5px 0 13px;


  color:
    var(--muted);


  font-size:.77rem;


  line-height:1.4;

}


/* ============================================================
   INPUT
   ============================================================ */

.input-wrap{

  position:relative;

  margin-bottom:9px;

}


.input-icon{

  position:absolute;

  left:14px;

  top:50%;


  width:17px;

  height:17px;


  transform:

    translateY(-50%);


  color:
    var(--ocean);


  pointer-events:none;

}


input{

  display:block;


  width:100%;


  min-height:47px;


  padding:

    11px 13px
    11px 42px;


  border:

    1.5px solid
    #D8E7EC;


  border-radius:14px;


  outline:none;


  background:#FFFFFF;


  color:
    var(--ink);


  font-family:
    var(--font-body);


  font-size:16px;

  font-weight:600;


  transition:

    border-color .18s ease,

    box-shadow .18s ease;

}


input::placeholder{

  color:#93A3AA;

  font-weight:500;

}


input:focus{

  border-color:
    var(--ocean);


  box-shadow:

    0 0 0 4px
    rgba(8,119,185,.10);

}


input[aria-invalid="true"]{

  border-color:
    var(--error);


  box-shadow:

    0 0 0 4px
    rgba(201,66,66,.09);

}


/* ============================================================
   BUTTON
   ============================================================ */

#btn{

  width:100%;


  min-height:47px;


  border:0;


  border-radius:14px;


  cursor:pointer;


  background:

    linear-gradient(
      110deg,

      var(--ocean),

      var(--teal)
    );


  color:#FFFFFF;


  font-family:
    var(--font-body);


  font-size:.9rem;

  font-weight:800;


  box-shadow:

    0 12px 24px
    rgba(8,119,185,.20);


  transition:

    transform .15s ease;

}


#btn:active{

  transform:
    scale(.99);

}


#btn:disabled{

  cursor:not-allowed;

}


#btn.success-state{

  background:#EAF8F1;


  border:

    1px solid
    #BCE7D5;


  color:
    var(--success);


  box-shadow:none;

}


/* ============================================================
   LOOKUP STATUS
   ============================================================ */

.loader{

  display:none;


  margin-top:11px;


  align-items:center;

  justify-content:center;


  gap:7px;


  color:
    var(--ocean-deep);


  font-size:.8rem;

  font-weight:600;

}


.loader.show{

  display:flex;

}


.spinner{

  width:15px;

  height:15px;


  border:

    2px solid
    rgba(8,119,185,.18);


  border-top-color:
    var(--ocean);


  border-radius:50%;


  animation:

    spin .75s
    linear
    infinite;

}


#msg{

  margin-top:9px;


  text-align:center;


  font-size:.8rem;

  font-weight:700;


  line-height:1.4;

}


.success{

  color:
    var(--success);

}


.error{

  color:
    var(--error);

}


/* ============================================================
   DOCUMENT HUB
   ============================================================ */

.downloads{

  display:none;

  margin-top:15px;

}


.downloads.show{

  display:block;

}


.docs-heading{

  display:flex;

  align-items:center;

  justify-content:space-between;


  margin-bottom:8px;

}


.docs-heading span:first-child{

  color:
    var(--ocean-deep);


  font-size:.7rem;

  font-weight:800;


  letter-spacing:.07em;

  text-transform:uppercase;

}


.docs-heading span:last-child{

  color:
    var(--muted);


  font-size:.67rem;

}


/* ============================================================
   NEW: INLINE DOCUMENT LOADER
   ============================================================ */

.inline-doc-loader{

  display:none;


  position:relative;


  align-items:center;


  gap:11px;


  margin-bottom:9px;


  padding:

    10px 12px;


  overflow:hidden;


  border:

    1px solid
    rgba(8,119,185,.13);


  border-radius:14px;


  background:

    linear-gradient(
      100deg,
      #EDF9FD 0%,
      #F5FBF8 48%,
      #FFF9E7 100%
    );


  box-shadow:

    0 6px 16px
    rgba(8,119,185,.07);


  animation:

    loaderEnter .2s ease;

}


.inline-doc-loader.show{

  display:flex;

}


.inline-loader-icon{

  flex-shrink:0;


  width:36px;

  height:36px;


  display:flex;

  align-items:center;

  justify-content:center;


  border-radius:11px;


  background:

    linear-gradient(
      135deg,
      var(--ocean),
      var(--teal)
    );


  box-shadow:

    0 6px 14px
    rgba(8,119,185,.18);

}


.inline-loader-spinner{

  width:18px;

  height:18px;


  border:

    2.5px solid
    rgba(255,255,255,.30);


  border-top-color:#FFFFFF;


  border-radius:50%;


  animation:

    spin .7s
    linear
    infinite;

}


.inline-loader-copy{

  min-width:0;


  display:flex;

  flex-direction:column;


  gap:2px;

}


.inline-loader-title{

  overflow:hidden;


  color:#164657;


  font-size:.79rem;

  font-weight:800;


  white-space:nowrap;

  text-overflow:ellipsis;

}


.inline-loader-subtitle{

  color:
    var(--muted);


  font-size:.66rem;

  font-weight:500;

}


.inline-doc-loader::after{

  content:"";


  position:absolute;


  left:0;

  bottom:0;


  height:2px;


  width:35%;


  border-radius:99px;


  background:

    linear-gradient(
      90deg,
      var(--ocean),
      var(--sunset)
    );


  animation:

    loaderProgress 1.2s
    ease-in-out
    infinite;

}


/* ============================================================
   DOCUMENT CARDS
   ============================================================ */

.docs-list{

  display:flex;

  flex-direction:column;


  gap:8px;

}


.doc-row{

  display:flex;

  align-items:center;


  gap:11px;


  min-height:61px;


  padding:

    10px 11px;


  border:

    1px solid
    #DDECEF;


  border-radius:16px;


  background:#FFFFFF;


  color:
    var(--ink);


  text-decoration:none;


  box-shadow:

    0 5px 14px
    rgba(25,88,108,.05);


  transition:

    transform .15s ease,

    box-shadow .15s ease,

    border-color .15s ease,

    opacity .15s ease;

}


a.doc-row:active{

  transform:
    scale(.985);

}


.doc-row.opening{

  border-color:

    rgba(8,119,185,.28);


  background:

    #F8FCFD;

}


.doc-icon{

  flex-shrink:0;


  width:38px;

  height:38px;


  display:flex;

  align-items:center;

  justify-content:center;


  border-radius:12px;


  color:
    var(--ocean-deep);


  background:

    linear-gradient(
      145deg,
      #E7F8FF,
      #F2FBF8
    );

}


.doc-icon svg{

  width:17px;

  height:17px;

}


.doc-text{

  flex:1;

  min-width:0;


  display:flex;

  flex-direction:column;


  gap:3px;

}


.doc-title{

  color:#173D4C;


  font-size:.85rem;

  font-weight:800;

}


.doc-desc{

  color:
    var(--muted);


  font-size:.71rem;


  line-height:1.33;

}


.doc-chevron{

  flex-shrink:0;


  width:17px;

  height:17px;


  color:
    var(--sunset);

}


.doc-row.pending{

  background:#F8FAFA;

  box-shadow:none;

  cursor:default;

}


.doc-desc.doc-soon{

  color:#A37545;

  font-weight:700;

}


.doc-status{

  width:16px;

  height:16px;


  color:#A0AEB3;

}


.doc-row[data-doc="pc"] .doc-icon{

  color:#A85D16;


  background:

    linear-gradient(
      145deg,
      #FFF8D8,
      #FFF0E4
    );

}


/* ============================================================
   RESET
   ============================================================ */

.reset-link{

  display:inline-flex;


  margin-top:11px;


  padding:

    5px 3px;


  border:0;


  background:transparent;


  color:
    var(--ocean-deep);


  font-family:
    var(--font-body);


  font-size:.72rem;

  font-weight:700;


  text-decoration:underline;

  text-underline-offset:3px;


  cursor:pointer;

}


.reset-link[hidden]{

  display:none;

}


/* ============================================================
   FOOTER
   ============================================================ */

.footer-note{

  margin-top:auto;


  padding-top:20px;


  color:#24596A;


  font-family:
    var(--font-display);


  font-size:.77rem;

  font-weight:800;

}


/* ============================================================
   TOAST
   ============================================================ */

.toast{

  position:fixed;


  top:14px;

  left:50%;


  z-index:10000;


  max-width:90vw;


  transform:
    translate(-50%,-8px);


  padding:

    10px 15px;


  border-radius:999px;


  background:

    rgba(255,255,255,.96);


  color:
    var(--ocean-deep);


  font-size:.8rem;

  font-weight:800;


  white-space:nowrap;


  box-shadow:

    0 12px 30px
    rgba(12,79,103,.18);


  opacity:0;


  pointer-events:none;


  transition:

    opacity .25s ease,

    transform .25s ease;

}


.toast.show{

  opacity:1;


  transform:
    translate(-50%,0);

}


/* ============================================================
   PU ANNOUNCEMENT
   ============================================================ */

.popup-overlay{

  display:none;


  position:fixed;

  inset:0;


  z-index:9000;


  align-items:center;

  justify-content:center;


  padding:20px;


  background:

    rgba(8,50,65,.48);


  backdrop-filter:

    blur(6px);


  -webkit-backdrop-filter:

    blur(6px);

}


.popup-overlay.show{

  display:flex;

}


.popup-box{

  position:relative;


  width:100%;

  max-width:480px;


  max-height:86vh;


  padding:18px;


  border-radius:24px;


  background:

    rgba(255,255,255,.98);


  box-shadow:

    0 30px 70px
    rgba(7,83,109,.28);

}


.popup-title{

  margin-bottom:12px;


  text-align:center;


  color:
    var(--ocean-deep);


  font-family:
    var(--font-display);


  font-size:1rem;

  font-weight:800;

}


.popup-close{

  position:absolute;


  top:-12px;

  right:-8px;


  width:36px;

  height:36px;


  border:0;


  border-radius:50%;


  background:
    var(--sunset);


  color:#FFFFFF;


  font-size:17px;


  cursor:pointer;

}


.popup-well{

  display:flex;

  align-items:center;

  justify-content:center;


  overflow:hidden;


  min-height:100px;


  padding:7px;


  border-radius:16px;


  background:#F4F8F9;

}


.popup-loading{

  display:flex;

  align-items:center;

  justify-content:center;


  gap:7px;


  padding:

    36px 12px;


  color:
    var(--ocean-deep);


  font-size:.82rem;

  font-weight:700;

}


.popup-well iframe{

  width:100%;

  height:56vh;


  border:0;


  border-radius:11px;

}


.popup-well img{

  display:block;


  max-width:100%;

  max-height:70vh;


  object-fit:contain;


  border-radius:11px;

}


/* ============================================================
   ANIMATIONS
   ============================================================ */

@keyframes spin{

  to{

    transform:
      rotate(360deg);

  }

}


@keyframes loaderEnter{

  from{

    opacity:0;

    transform:
      translateY(-4px);

  }


  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


@keyframes loaderProgress{

  0%{

    left:-35%;

  }


  50%{

    left:45%;

  }


  100%{

    left:100%;

  }

}


/* ============================================================
   MOBILE
   ============================================================ */

@media(max-width:480px){

  :root{

    --safe-fraction:.445;

  }


  .page{

    padding:

      var(--safe-y)

      15px

      22px;

  }

}


/* ============================================================
   SHORTER MOBILE SCREENS
   ============================================================ */

@media(max-width:480px) and (max-height:700px){

  :root{

    --safe-fraction:.42;

  }


  .countdown-wrap{

    padding:

      9px 11px;


    margin-bottom:9px;

  }


  .card{

    padding:

      17px 16px 16px;

  }

}


/* ============================================================
   DESKTOP
   ============================================================ */

@media(min-width:600px){

  .card,
  .countdown-wrap{

    max-width:420px;

  }


  .card{

    padding:

      27px 27px 23px;

  }

}


@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.001ms !important;

    transition-duration:.001ms !important;

  }

}

</style>

</head>


<body>


<div
  class="hero-bg"
  aria-hidden="true">
</div>


<div
  class="bg-overlay"
  aria-hidden="true">
</div>


<div
  class="toast"
  id="toast"
  role="status"
  aria-live="polite">
</div>


<h1 class="sr-only">

  Colombo Training Convention 2026

</h1>

<script>

/* ============================================================
   CONFIG
   ============================================================ */

const API_URL =
"https://script.google.com/macros/s/AKfycbxrW_2FiQXPp64YLDEvKEJC-FNu4qiVfHNhr7iyj_9yuFb6a2P7OUHl4vI2N-39JAir/exec";


const CONVENTION_DATE =
new Date(
  "2026-10-05T00:00:00"
);


let verifiedLookupValue =
"";


let popupShownThisLoad =
false;


let documentLoaderTimer =
null;


let activeOpeningRow =
null;



/* ============================================================
   DOCUMENT AVAILABILITY

   F4 remains available in backend but hidden for Colombo.
   ============================================================ */

const DOC_AVAILABILITY = {

  f1:true,

  f2:true,

  f3:true,

  pc:true

};



/* ============================================================
   ICONS
   ============================================================ */

const ICON_NOTE =
'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.8h5.2L12 4.6v9.6H4z"/><path d="M9.2 1.8v2.8H12"/><path d="M6 8.4h4M6 10.6h4"/></svg>';


const ICON_CHECKLIST =

const ICON_CAL =
'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="11" rx="1.3"/><path d="M2 6.4h12"/><path d="M5.4 1.6v2.4M10.6 1.6v2.4"/></svg>';


const ICON_PRODUCT =
'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M5 5h6M5 8h6M5 11h4"/></svg>';


const ICON_CLOCK =
'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.4"/><path d="M8 4.8V8l2.6 1.6"/></svg>';


const ICON_CHEVRON =
'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 11 8l-5 4.5"/></svg>';



/* ============================================================
   DOCUMENTS
   ============================================================ */

const DOCS = [

    key:"f1",

    label:"CEO's Note",

    desc:"A welcome message ahead of the Colombo convention.",

    icon:ICON_NOTE

  },


  {

    key:"f3",

    desc:"Your complete day-by-day Colombo schedule.",

    icon:ICON_CAL

  },


  {

    key:"f2",

    label:"Do's & Don'ts",

    desc:"Important guidelines to keep in mind throughout your Colombo journey.",

    icon:ICON_CHECKLIST

  },


  {

    desc:"Product information and reference material for easy access during the convention.",

    icon:ICON_PRODUCT

  }

];



/* ============================================================
   INLINE DOCUMENT LOADER
   ============================================================ */

function showDocumentLoading(
  documentName,
  row
){

  const loader =

    document.getElementById(
      "inlineDocLoader"
    );


  const title =

    document.getElementById(
      "inlineLoaderTitle"
    );


  clearTimeout(
    documentLoaderTimer
  );


  if(
    activeOpeningRow
  ){

    activeOpeningRow.classList.remove(
      "opening"
    );

  }


  activeOpeningRow =
    row;


  if(
    activeOpeningRow
  ){

    activeOpeningRow.classList.add(
      "opening"
    );

  }


  title.textContent =

    "Opening " +
    documentName +
    "...";


  loader.classList.add(
    "show"
  );


  /*
   * Scroll only if loader is outside the visible area.
   * Usually no movement is required.
   */

  const rect =
    loader.getBoundingClientRect();


  if(
    rect.top < 0
    ||
    rect.bottom > window.innerHeight
  ){

    loader.scrollIntoView({

      behavior:"smooth",

      block:"nearest"

    });

  }


  /*
   * Automatically clear after 2.2 sec.
   */

  documentLoaderTimer =

    setTimeout(

      hideDocumentLoading,

      2200

    );

}



function hideDocumentLoading(){


  const loader =

    document.getElementById(
      "inlineDocLoader"
    );


  loader.classList.remove(
    "show"
  );


  if(
    activeOpeningRow
  ){

    activeOpeningRow.classList.remove(
      "opening"
    );


    activeOpeningRow =
      null;

  }

}



/* ============================================================
   TRACK DOCUMENT CLICK
   ============================================================ */

async function trackDocument(
  docKey
){

  if(
    !verifiedLookupValue
  ){

    return null;

  }


  const trackingUrl =

    API_URL +

    "?action=track" +

    "&input=" +

    encodeURIComponent(
      verifiedLookupValue
    ) +

    "&doc=" +

    encodeURIComponent(
      docKey
    ) +

    "&_=" +

    Date.now();


  try{


    const response =

      await fetch(

        trackingUrl,

        {

          method:"GET",

          cache:"no-store",

          keepalive:true

        }

      );


    const data =

      await response.json();


    console.log(

      docKey,

      "opens:",

      data.count

    );


    return data;


  }


  catch(error){


    console.warn(

      "Tracking failed:",

      docKey,

      error

    );


    return null;

  }

}



/* ============================================================
   RENDER DOCUMENTS
   ============================================================ */

function renderDocs(
  fileMap
){

  const list =

    document.getElementById(
      "docsList"
    );


  list.innerHTML =
    "";


  DOCS.forEach(
    function(d){


      const url =

        String(
          fileMap[d.key] || ""
        )
        .trim();


      const available =

        Boolean(
          DOC_AVAILABILITY[d.key]
        )

        &&

        url !== "";


      /* ======================================================
         AVAILABLE DOCUMENT
         ====================================================== */

      if(
        available
      ){


        const link =

          document.createElement(
            "a"
          );


        link.className =
          "doc-row";


        link.dataset.doc =
          d.key;


        link.href =
          url;


        /*
         * IMPORTANT:
         * Document opens separately.
         * Original Colombo page stays open.
         */

        link.target =
          "_blank";


        link.rel =
          "noopener";


        link.setAttribute(

          "aria-label",

          d.label +
          " — " +
          d.desc

        );


        link.innerHTML =

          '<span class="doc-icon" aria-hidden="true">' +

            d.icon +

          '</span>' +

          '<span class="doc-text">' +

            '<span class="doc-title">' +

              d.label +

            '</span>' +

            '<span class="doc-desc">' +

              d.desc +

            '</span>' +

          '</span>' +

          '<span class="doc-chevron" aria-hidden="true">' +

            ICON_CHEVRON +

          '</span>';



        /* ====================================================
           DOCUMENT CLICK
           ==================================================== */

        link.addEventListener(

          "click",

          function(event){


            /*
             * Do NOT preventDefault.
             *
             * Browser handles target="_blank" natively.
             * This prevents the about:blank issue.
             */


            /* Show compact loader on current page */

            showDocumentLoading(

              d.label,

              link

            );


            /*
             * Send tracking request without waiting.
             *
             * Because the original page remains open,
             * the request can finish in the background.
             */

            trackDocument(
              d.key
            );

          }

        );


        list.appendChild(
          link
        );

      }


      /* ======================================================
         COMING SOON
         ====================================================== */

      else{


        const row =

          document.createElement(
            "div"
          );


        row.className =
          "doc-row pending";


        row.dataset.doc =
          d.key;


        row.setAttribute(

          "aria-disabled",

          "true"

        );


        row.innerHTML =

          '<span class="doc-icon" aria-hidden="true">' +

            d.icon +

          '</span>' +

          '<span class="doc-text">' +

            '<span class="doc-title">' +

              d.label +

            '</span>' +

            '<span class="doc-desc doc-soon">' +

              'Coming soon' +

            '</span>' +

          '</span>' +

          '<span class="doc-status" aria-hidden="true">' +

            ICON_CLOCK +

          '</span>';


        list.appendChild(
          row
        );

      }

    }

  );

}



/* ============================================================
   COUNTDOWN
   ============================================================ */

function getDaysRemaining(){


  const now =
    new Date();


  const today =

    new Date(

      now.getFullYear(),

      now.getMonth(),

      now.getDate()

    );


  const target =

    new Date(

      CONVENTION_DATE.getFullYear(),

      CONVENTION_DATE.getMonth(),

      CONVENTION_DATE.getDate()

    );


  return Math.round(

    (
      target -
      today
    )

    /

    86400000

  );

}



function updateCountdown(){


  const diff =

    CONVENTION_DATE -

    new Date();


  const label =

    document.getElementById(
      "countdownLabel"
    );


  const stats =

    document.getElementById(
      "countdownStats"
    );


  const wrap =

    document.getElementById(
      "countdownWrap"
    );


  let done =

    document.getElementById(
      "countdownDone"
    );


  if(
    diff <= 0
  ){


    label.style.display =
      "none";


    stats.style.display =
      "none";


    if(
      !done
    ){


      done =

        document.createElement(
          "div"
        );


      done.id =
        "countdownDone";


      done.className =
        "countdown-done";


      wrap.appendChild(
        done
      );

    }


    done.style.display =
      "inline-flex";


    done.textContent =

      getDaysRemaining() === 0

      ?

      "Colombo starts today"

      :

      "See you in Colombo";


    return;

  }


  if(
    done
  ){

    done.style.display =
      "none";

  }


  const days =

    Math.floor(
      diff /
      86400000
    );


  const hours =

    Math.floor(

      (
        diff %
        86400000
      )

      /

      3600000

    );


  const mins =

    Math.floor(

      (
        diff %
        3600000
      )

      /

      60000

    );


  document.getElementById(
    "cdDays"
  ).textContent =
    days;


  document.getElementById(
    "cdHours"
  ).textContent =

    String(
      hours
    )
    .padStart(
      2,
      "0"
    );


  document.getElementById(
    "cdMins"
  ).textContent =

    String(
      mins
    )
    .padStart(
      2,
      "0"
    );

}



/* ============================================================
   PU ANNOUNCEMENT
   ============================================================ */

const POPUP_SESSION_KEY =
"colomboConventionPopupShown";


let lastFocusedEl =
null;



function isImageUrl(
  url
){

  return /\.(png|jpe?g|gif|webp|bmp|svg)(\?.*)?$/i.test(
    url
  );

}



function openPopup(){


  lastFocusedEl =
    document.activeElement;


  document

    .getElementById(
      "popupOverlay"
    )

    .classList

    .add(
      "show"
    );

}



function closePopup(){


  document

    .getElementById(
      "popupOverlay"
    )

    .classList

    .remove(
      "show"
    );


  document.getElementById(
    "popupFrame"
  ).src =
    "";


  document.getElementById(
    "popupImage"
  ).src =
    "";


  if(
    lastFocusedEl
    &&
    typeof lastFocusedEl.focus === "function"
  ){

    lastFocusedEl.focus();

  }

}



function renderPopupContent(
  url
){


  const image =

    document.getElementById(
      "popupImage"
    );


  const frame =

    document.getElementById(
      "popupFrame"
    );


  const loading =

    document.getElementById(
      "popupLoading"
    );


  loading.style.display =
    "flex";


  image.style.display =
    "none";


  frame.style.display =
    "none";


  if(
    isImageUrl(
      url
    )
  ){


    frame.src =
      "";


    image.onload =
      function(){


        loading.style.display =
          "none";


        image.style.display =
          "block";

      };


    image.onerror =
      function(){


        loading.style.display =
          "none";

      };


    image.src =
      url;

  }


  else{


    image.src =
      "";


    frame.onload =
      function(){


        loading.style.display =
          "none";


        frame.style.display =
          "block";

      };


    frame.src =
      url;

  }

}



async function showGeneralPopup(){


  if(

    sessionStorage.getItem(
      POPUP_SESSION_KEY
    )
    ===
    "1"

  ){

    return;

  }


  try{


    const response =

      await fetch(

        API_URL +

        "?action=popup&_=" +

        Date.now(),

        {

          cache:"no-store"

        }

      );


    const data =

      await response.json();


    if(
      data
      &&
      data.popup
    ){


      renderPopupContent(
        data.popup
      );


      sessionStorage.setItem(

        POPUP_SESSION_KEY,

        "1"

      );


      popupShownThisLoad =
        true;


      openPopup();

    }

  }


  catch(error){


    console.warn(

      "Announcement unavailable:",

      error

    );

  }

}

  const msg =

  input.removeAttribute(
    "aria-invalid"
  );


  msg.textContent =
    "";


  msg.className =
    "";


  document

    .getElementById(
      "downloads"
    )

    .classList

    .remove(
      "show"
    );


  document.getElementById(
    "docsList"
  ).innerHTML =
    "";


  btn.disabled =
    false;


  btn.textContent =
    "Unlock Pack";


  btn.classList.remove(
    "success-state"
  );


  document.getElementById(
    "resetLink"
  ).hidden =
    true;


  input.focus();

}



/* ============================================================
   EMPLOYEE LOOKUP
   ============================================================ */

async function searchDoc(
  event
){


  event.preventDefault();


  const input =

    document.getElementById(
      "input"
    );


  const value =

    input.value.trim();


  const msg =

    document.getElementById(
      "msg"
    );


  const loader =

    document.getElementById(
      "loader"
    );


  const btn =

    document.getElementById(
      "btn"
    );


  if(
    !value
  ){


    msg.className =
      "error";


    msg.textContent =
      "Enter your Employee ID or mobile number.";


    input.setAttribute(

      "aria-invalid",

      "true"

    );


    return;

  }


  input.removeAttribute(
    "aria-invalid"
  );


  msg.textContent =
    "";


  loader.classList.add(
    "show"
  );


  btn.disabled =
    true;


  try{


    const response =

      await fetch(

        API_URL +

        "?input=" +

        encodeURIComponent(
          value
        ) +

        "&_=" +

        Date.now(),

        {

          cache:"no-store"

        }

      );


    const data =

      await response.json();


    loader.classList.remove(
      "show"
    );


    if(
      data.status === "success"
    ){


      verifiedLookupValue =
        value;


      msg.className =
        "success";


      msg.textContent =
        "Verified. Your pack is ready.";


      /*
       * F4 remains in backend,
       * but is not displayed on Colombo yet.
       */

      renderDocs({

        f1:data.f1,

        f2:data.f2,

        f3:data.f3,

        pc:data.pc

      });


      document

        .getElementById(
          "downloads"
        )

        .classList

        .add(
          "show"
        );


      btn.textContent =
        "✓ Pack Unlocked";


      btn.classList.add(
        "success-state"
      );


      btn.disabled =
        true;


      document.getElementById(
        "resetLink"
      ).hidden =
        false;


      /*
       * PU tracking remains active.
       */

      if(
        popupShownThisLoad
      ){


        trackDocument(
          "pu"
        );


        popupShownThisLoad =
          false;

      }


      celebrateSuccess();

    }


    else{


      verifiedLookupValue =
        "";


      btn.disabled =
        false;


      msg.className =
        "error";


      msg.textContent =

        data.message

        ||

        "No record found.";


      input.setAttribute(

        "aria-invalid",

        "true"

      );

    }

  }


  catch(error){


    loader.classList.remove(
      "show"
    );


    btn.disabled =
      false;


    msg.className =
      "error";


    msg.textContent =
      "Unable to connect. Try again.";

  }

}



/* ============================================================
   SUCCESS TOAST
   ============================================================ */

const successMessages = [

  "Colombo is calling 🌴",

  "Your Colombo pack is ready",

  "Sri Lanka, here we come ☀",

  "Adventure awaits"

];


let toastTimer =
null;



function celebrateSuccess(){


  const toast =

    document.getElementById(
      "toast"
    );


  toast.textContent =

    successMessages[

      Math.floor(

        Math.random()

        *

        successMessages.length

      )

    ];


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =

    setTimeout(

      function(){


        toast.classList.remove(
          "show"
        );

      },

      2200

    );

}



/* ============================================================
   EVENTS
   ============================================================ */

document

  .getElementById(
    "lookupForm"
  )

  .addEventListener(

    "submit",

    searchDoc

  );


document

  .getElementById(
    "resetLink"
  )

  .addEventListener(

    "click",

    resetLookupState

  );


window.addEventListener(

  "DOMContentLoaded",

  function(){


    updateCountdown();


    setInterval(

      updateCountdown,

      20000

    );


    showGeneralPopup();

  }

);


/*
 * If employee returns from a document,
 * remove the loading message immediately.
 */

window.addEventListener(

  "focus",

  hideDocumentLoading

);


window.addEventListener(

  "pageshow",

  hideDocumentLoading

);


document.addEventListener(

  "visibilitychange",

  function(){


    if(
      document.visibilityState === "visible"
    ){

      hideDocumentLoading();

    }

  }

);

</script>


</body>

</html>
